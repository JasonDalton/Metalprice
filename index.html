<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Metal Prices Reference</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0e27">
    <meta name="description" content="Quick reference for silver and gold spot prices with fractional sizes and constitutional silver">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Metal Prices">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons for iOS -->
    <link rel="apple-touch-icon" href="web-app-manifest-192x192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            line-height: 1.2;
            padding: 4px;
            font-size: 11px;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0;
        }

        .spot-prices {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
            padding: 4px 6px;
            background: #1a1f3a;
            border-radius: 4px;
        }

        .spot-price {
            flex: 1;
            text-align: center;
        }

        .spot-price-label {
            font-size: 9px;
            color: #888;
            margin-bottom: 2px;
        }

        .spot-price-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            line-height: 1.1;
        }

        .spot-price-time {
            font-size: 8px;
            color: #666;
            margin-top: 2px;
            line-height: 1.2;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            padding: 2px 4px;
        }

        .refresh-btn {
            padding: 4px 8px;
            background: #2a3f5f;
            border: none;
            border-radius: 3px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 10px;
        }

        .refresh-btn:active {
            background: #3a4f6f;
        }

        #refresh-status {
            font-size: 9px;
            color: #888;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }

        .tab {
            padding: 4px 8px;
            background: #1a1f3a;
            border: 1px solid #2a3f5f;
            border-radius: 3px 3px 0 0;
            cursor: pointer;
            color: #888;
            font-size: 10px;
            flex: 1;
            text-align: center;
        }

        .tab.active {
            background: #2a3f5f;
            color: #ffd700;
            border-bottom: 1px solid #2a3f5f;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .table-section {
            margin-bottom: 6px;
        }

        .table-section h2 {
            color: #ffd700;
            margin-bottom: 3px;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1f3a;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
            font-size: 9px;
        }

        thead {
            background: #2a3f5f;
        }

        th {
            padding: 3px 4px;
            text-align: center;
            color: #ffd700;
            font-weight: 600;
            font-size: 8px;
            white-space: nowrap;
        }

        td {
            padding: 3px 4px;
            border-bottom: 1px solid #2a3f5f;
            text-align: center;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:active {
            background: #252a4a;
        }

        .price {
            font-weight: bold;
            font-family: 'Courier New', monospace;
            font-size: 9px;
        }

        .price.negative {
            color: #ff6b6b;
        }

        .price.positive {
            color: #4ade80;
        }

        .price.melt {
            color: #ffd700;
            font-weight: 700;
        }

        .size {
            color: #e0e0e0;
            text-align: left;
            font-size: 9px;
        }

        .error {
            background: #4a1a1a;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #6b2a2a;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }

        /* Mobile-first: already optimized */
    </style>
</head>
<body>

    <script>
        // Force cache clear on load - remove old cached versions
        (function() {
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        if (name.includes('metal-prices')) {
                            caches.delete(name);
                            console.log('Deleted cache:', name);
                        }
                    }
                });
            }
        })();
        
        // Constants
        const TROY_OZ_TO_GRAM = 31.1035;
        const CONSTITUTIONAL_SILVER_PER_DOLLAR = 0.715; // troy oz per $1 face value

        // State
        let silverSpot = 0;
        let goldSpot = 0;
        let lastUpdate = null;
        let lastFetchTime = 0;
        const MIN_FETCH_INTERVAL = 30 * 1000; // 30 seconds minimum between API calls

        // Silver sizes (troy oz)
        const silverOzSizes = [
            { label: '1/10 oz', value: 0.1 },
            { label: '1/4 oz', value: 0.25 },
            { label: '1/2 oz', value: 0.5 },
            { label: '1 oz', value: 1 },
            { label: '10 oz bar', value: 10 },
            { label: '100 oz bar', value: 100 }
        ];

        // Silver gram sizes
        const silverGramSizes = [
            { label: '1 g', value: 1 },
            { label: '2.5 g', value: 2.5 },
            { label: '5 g', value: 5 },
            { label: '10 g', value: 10 },
            { label: '20 g', value: 20 },
            { label: '31.1 g (1 oz)', value: 31.1035 },
            { label: '50 g', value: 50 },
            { label: '100 g', value: 100 }

        // Constitutional silver
        const constitutionalSizes = [
            { label: 'Dime', face: 0.10, oz: CONSTITUTIONAL_SILVER_PER_DOLLAR * 0.10 },
            { label: 'Quarter', face: 0.25, oz: CONSTITUTIONAL_SILVER_PER_DOLLAR * 0.25 },
            { label: 'Half Dollar', face: 0.50, oz: CONSTITUTIONAL_SILVER_PER_DOLLAR * 0.50 },
            { label: 'Dollar', face: 1.00, oz: CONSTITUTIONAL_SILVER_PER_DOLLAR * 1.00 },
            { label: '$1 Face Value', face: 1.00, oz: CONSTITUTIONAL_SILVER_PER_DOLLAR }
        ];

        // Gold sizes (troy oz)
        const goldOzSizes = [
            { label: '1/200 oz', value: 0.005 },
            { label: '1/10 oz', value: 0.1 },
            { label: '1/4 oz', value: 0.25 },
            { label: '1/2 oz', value: 0.5 },
            { label: '1 oz', value: 1 },
            { label: '10 oz bar', value: 10 },
            { label: '1 kg bar', value: 1000 / TROY_OZ_TO_GRAM }
        ];

        // Gold gram sizes
        const goldGramSizes = [
            { label: '1 g', value: 1 },
            { label: '2.5 g', value: 2.5 },
            { label: '5 g', value: 5 },
            { label: '10 g', value: 10 },
            { label: '20 g', value: 20 },
            { label: '31.1 g (1 oz)', value: 31.1035 },
            { label: '50 g', value: 50 },
            { label: '100 g', value: 100 }
        ];

        // Format currency (compact for mobile)
        function formatCurrency(value) {
            if (value < 1) {
                return '$' + value.toFixed(3);
            } else if (value < 1000) {
                return '$' + value.toFixed(2);
            } else {
                return '$' + value.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            }
        }

        // Format date and time (compact)
        function formatDateTime(date) {
            const today = new Date();
            const isToday = date.toDateString() === today.toDateString();
            
            if (isToday) {
                // Show just time if today
                return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            } else {
                // Show date and time if not today
                const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit' });
                const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                return `${dateStr} ${timeStr}`;
            }
        }
        
        // Format full date and time for display
        function formatFullDateTime(date) {
            const dateStr = date.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' });
            const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            return `${dateStr} ${timeStr}`;
        }

        // Calculate price with percentage adjustment
        function applyPercentage(basePrice, percent) {
            return basePrice * (1 + percent / 100);
        }

        // Update spot price displays
        function updateSpotDisplays() {
            // Only show prices if we have valid data (no fallback/zero values)
            if (silverSpot > 0) {
                document.getElementById('silver-spot').textContent = formatCurrency(silverSpot);
            } else {
                document.getElementById('silver-spot').textContent = 'N/A';
            }
            
            if (goldSpot > 0) {
                document.getElementById('gold-spot').textContent = formatCurrency(goldSpot);
            } else {
                document.getElementById('gold-spot').textContent = 'N/A';
            }
            
            if (lastUpdate && silverSpot > 0 && goldSpot > 0) {
                const dateTimeStr = formatFullDateTime(lastUpdate);
                document.getElementById('silver-time').textContent = dateTimeStr;
                document.getElementById('gold-time').textContent = dateTimeStr;
            } else {
                document.getElementById('silver-time').textContent = '--/-- --:--';
                document.getElementById('gold-time').textContent = '--/-- --:--';
            }
        }


        // Update silver troy oz table
        function updateSilverOzTable() {
            const tbody = document.getElementById('silver-oz-body');
            tbody.innerHTML = '';
            
            // Only show data if we have valid spot price
            if (silverSpot <= 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">No price data available</td></tr>';
                return;
            }
            
            silverOzSizes.forEach(size => {
                const meltValue = silverSpot * size.value;
                const minus10 = applyPercentage(meltValue, -10);
                const minus5 = applyPercentage(meltValue, -5);
                const plus5 = applyPercentage(meltValue, 5);
                const plus10 = applyPercentage(meltValue, 10);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="size">${size.label}</td>
                    <td class="price negative">${formatCurrency(minus10)}</td>
                    <td class="price negative">${formatCurrency(minus5)}</td>
                    <td class="price melt">${formatCurrency(meltValue)}</td>
                    <td class="price positive">${formatCurrency(plus5)}</td>
                    <td class="price positive">${formatCurrency(plus10)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Update silver gram table
        function updateSilverGramTable() {
            const tbody = document.getElementById('silver-gram-body');
            tbody.innerHTML = '';
            
            if (silverSpot <= 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #888;">No price data available</td></tr>';
                return;
            }
            
            silverGramSizes.forEach(size => {
                // Convert grams to troy oz
                const troyOz = size.value / TROY_OZ_TO_GRAM;
                const meltValue = silverSpot * troyOz;
                const minus10 = applyPercentage(meltValue, -10);
                const minus5 = applyPercentage(meltValue, -5);
                const plus5 = applyPercentage(meltValue, 5);
                const plus10 = applyPercentage(meltValue, 10);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="size">${size.label}</td>
                    <td class="price negative">${formatCurrency(minus10)}</td>

        function updateConstitutionalTable() {

        function updateGoldOzTable() {

        // Update all tables
        function updateAllTables() {
            updateSilverOzTable();
            updateSilverGramTable();
            updateConstitutionalTable();
            updateGoldOzTable();
            updateGoldGramTable();
        }

        // Fetch and parse prices from APMEX widget
        async function fetchPricesFromAPMEX() {
            // Use the APMEX widget URL which should be simpler and not blocked
            const widgetUrl = 'https://widgets.apmex.com/widget/spotprice/?w=280&h=180&mtls=GS&arf=False&rint=5&srf=False&tId=1&wId=1';
            
            try {
                console.log('Fetching prices from APMEX widget...');
                const response = await fetch(widgetUrl, {
                    headers: {
                        'Accept': 'text/html',
                    },
                    mode: 'cors',
                });

                if (!response.ok) {
                    throw new Error(`APMEX widget fetch error: ${response.status}`);
                }

                const html = await response.text();
                console.log('Successfully fetched from APMEX widget');
                return parseAPMEXHTML(html);
            } catch (error) {
                // If CORS blocks it, try with proxy
                if (error.message.includes('CORS') || error.message.includes('Failed to fetch')) {
                    console.log('Direct fetch blocked by CORS, trying proxy...');
                    return fetchPricesFromAPMEXWithProxy(widgetUrl);
                }
                throw error;
            }
        }
        
        // Fallback: Fetch via CORS proxy
        async function fetchPricesFromAPMEXWithProxy(widgetUrl) {
            // Try multiple CORS proxies as fallbacks
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?',
                'https://api.codetabs.com/v1/proxy?quest=',
            ];
            
            let html = null;
            let lastError = null;
            
            for (const proxyUrl of proxies) {
                try {
                    const url = proxyUrl + encodeURIComponent(widgetUrl);
                    console.log('Trying proxy:', proxyUrl);
                    
                    const response = await fetch(url, {
                        headers: {
                            'Accept': 'text/html',
                        },
                        mode: 'cors',
                    });

                    if (!response.ok) {
                        throw new Error(`Proxy error: ${response.status}`);
                    }

                    html = await response.text();
                    console.log('Successfully fetched via proxy:', proxyUrl);
                    break; // Success, exit loop
                } catch (error) {
                    console.log('Proxy failed:', proxyUrl, error.message);
                    lastError = error;
                    continue; // Try next proxy
                }
            }
            
            if (!html) {
                throw new Error(`All CORS proxies failed. Last error: ${lastError?.message || 'Unknown'}`);
            }
            
            return parseAPMEXHTML(html);
        }
        
        // Parse HTML to extract prices from APMEX widget
        function parseAPMEXHTML(html) {
            console.log('APMEX HTML fetched, length:', html.length);
            
            let silverPrice = 0;
            let goldPrice = 0;
            
            // Strategy 1: Look for JSON data in script tags (widgets often use this)
            const jsonMatches = html.match(/<script[^>]*>([\s\S]*?)<\/script>/gi);
            if (jsonMatches) {
                for (const script of jsonMatches) {
                    // Try to find JSON objects with price data
                    const jsonObjMatch = script.match(/{[^{}]*"(?:silver|gold|ag|au|price|spot)[^{}]*}/i);
                    if (jsonObjMatch) {
                        try {
                            const data = JSON.parse(jsonObjMatch[0]);
                            // Check various possible property names
                            if (data.silver || data.ag || data.Silver || data.AG) {
                                silverPrice = parseFloat(data.silver || data.ag || data.Silver || data.AG);
                            }
                            if (data.gold || data.au || data.Gold || data.AU) {
                                goldPrice = parseFloat(data.gold || data.au || data.Gold || data.AU);
                            }
                        } catch (e) {
                            // Try a more flexible JSON extraction
                            const silverMatch = script.match(/"silver"\s*:\s*"?(\d+\.\d{2})"?/i) || 
                                              script.match(/"ag"\s*:\s*"?(\d+\.\d{2})"?/i);
                            const goldMatch = script.match(/"gold"\s*:\s*"?(\d+\.\d{2})"?/i) || 
                                            script.match(/"au"\s*:\s*"?(\d+\.\d{2})"?/i);
                            if (silverMatch && silverMatch[1]) silverPrice = parseFloat(silverMatch[1]);
                            if (goldMatch && goldMatch[1]) goldPrice = parseFloat(goldMatch[1]);
                        }
                    }
                }
            }
            
            // Strategy 2: Look for data attributes
            const dataSilverMatch = html.match(/data-silver-price=["'](\d+\.\d{2})["']/i) || 
                                   html.match(/data-price-silver=["'](\d+\.\d{2})["']/i) ||
                                   html.match(/data-ag=["'](\d+\.\d{2})["']/i);
            const dataGoldMatch = html.match(/data-gold-price=["'](\d+\.\d{2})["']/i) || 
                                 html.match(/data-price-gold=["'](\d+\.\d{2})["']/i) ||
                                 html.match(/data-au=["'](\d+\.\d{2})["']/i);
            
            if (dataSilverMatch && dataSilverMatch[1]) {
                silverPrice = parseFloat(dataSilverMatch[1]);
            }
            if (dataGoldMatch && dataGoldMatch[1]) {
                goldPrice = parseFloat(dataGoldMatch[1]);
            }
            
            // Strategy 3: Look for "Silver" or "Gold" text followed by price
            // More flexible pattern that handles various HTML structures
            const silverPatterns = [
                /(?:silver|ag)\s*[:\s]*\$?(\d+\.\d{2})/i,
                /(?:silver|ag).*?(\d+\.\d{2}).*?(?:oz|troy)/i,
            ];
            const goldPatterns = [
                /(?:gold|au)\s*[:\s]*\$?(\d+\.\d{2})/i,
                /(?:gold|au).*?(\d+\.\d{2}).*?(?:oz|troy)/i,
            ];
            
            for (const pattern of silverPatterns) {
                const match = html.match(pattern);
                if (match && match[1]) {
                    const price = parseFloat(match[1]);
                    if (price > 10 && price < 100 && !silverPrice) {
                        silverPrice = price;
                        break;
                    }
                }
            }
            
            for (const pattern of goldPatterns) {
                const match = html.match(pattern);
                if (match && match[1]) {
                    const price = parseFloat(match[1]);
                    if (price > 1000 && price < 10000 && !goldPrice) {
                        goldPrice = price;
                        break;
                    }
                }
            }
            
            // Strategy 4: Extract all prices and use reasonable ranges
            const pricePattern = /\$(\d+\.\d{2})/g;
            const prices = [];
            let match;
            while ((match = pricePattern.exec(html)) !== null) {
                const price = parseFloat(match[1]);
                if (price > 10 && price < 100) {
                    prices.push({price, type: 'silver'});
                } else if (price > 1000 && price < 10000) {
                    prices.push({price, type: 'gold'});
                }
            }
            
            // If we found prices but not specifically identified, use the first of each range
            if (!silverPrice && prices.some(p => p.type === 'silver')) {
                silverPrice = prices.find(p => p.type === 'silver').price;
            }
            if (!goldPrice && prices.some(p => p.type === 'gold')) {
                goldPrice = prices.find(p => p.type === 'gold').price;
            }
            
            // Fallback: If we have exactly 2 prices in reasonable ranges, assign them
            if (prices.length === 2 && (!silverPrice || !goldPrice)) {
                prices.sort((a, b) => a.price - b.price);
                if (!silverPrice && prices[0].price > 10 && prices[0].price < 100) {
                    silverPrice = prices[0].price;
                }
                if (!goldPrice && prices[1].price > 1000 && prices[1].price < 10000) {
                    goldPrice = prices[1].price;
                }
            }
            
            console.log('Parsed prices from APMEX - Silver:', silverPrice, 'Gold:', goldPrice);
            
            if (isNaN(silverPrice) || isNaN(goldPrice) || silverPrice <= 0 || goldPrice <= 0) {
                console.error('Failed to parse prices from APMEX. Silver:', silverPrice, 'Gold:', goldPrice);
                // Log a snippet of the HTML for debugging
                const snippet = html.substring(0, 5000);
                console.error('HTML snippet:', snippet);
                throw new Error(`Failed to parse prices from APMEX. Silver: ${silverPrice}, Gold: ${goldPrice}`);
            }
            
            return { silverPrice, goldPrice };
        }


        // Fetch prices from APMEX website
        async function fetchPrices(forceRefresh = false) {
            const statusEl = document.getElementById('refresh-status');
            
            // Rate limiting - prevent excessive requests
            const now = Date.now();
            const timeSinceLastFetch = now - lastFetchTime;
            
            if (!forceRefresh && timeSinceLastFetch < MIN_FETCH_INTERVAL && lastFetchTime > 0) {
                console.log('Skipping fetch - too soon since last fetch. Wait', Math.ceil((MIN_FETCH_INTERVAL - timeSinceLastFetch) / 1000), 'seconds');
                statusEl.textContent = '⏱ Wait ' + Math.ceil((MIN_FETCH_INTERVAL - timeSinceLastFetch) / 1000) + 's';
                statusEl.style.color = '#ffa500';
                setTimeout(() => {
                    statusEl.textContent = '';
                }, 2000);
                return;
            }
            
            statusEl.textContent = 'Refreshing...';
            statusEl.style.color = '#888';
            lastFetchTime = now;

            try {
                // Fetch from APMEX header ticker
                console.log('Fetching prices from APMEX...');
                const data = await fetchPricesFromAPMEX();
                const silverPrice = data.silverPrice;
                const goldPrice = data.goldPrice;
                
                // Validate data (silver typically 15-50, gold typically 1500-3000, but allow wider range)
                if (silverPrice > 0 && silverPrice < 200 && goldPrice > 0 && goldPrice < 50000) {
                    console.log('Successfully fetched from APMEX - Silver:', silverPrice, 'Gold:', goldPrice);
                    
                    silverSpot = silverPrice;
                    goldSpot = goldPrice;
                    lastUpdate = new Date();
                    
                    // Save to localStorage
                    localStorage.setItem('silverSpot', silverSpot.toString());
                    localStorage.setItem('goldSpot', goldSpot.toString());
                    localStorage.setItem('lastUpdate', lastUpdate.toISOString());

                    updateSpotDisplays();
                    updateAllTables();
                    
                    statusEl.textContent = '✓ Updated';
                    statusEl.style.color = '#4ade80';
                    setTimeout(() => {
                        statusEl.textContent = '';
                    }, 2000);
                } else {
                    throw new Error(`APMEX returned invalid data - Silver: ${silverPrice}, Gold: ${goldPrice}`);
                }
            } catch (error) {
                console.error('Error fetching prices:', error);
                
                // Check if it's a quota error
                const isQuotaError = error.message && error.message.includes('quota');
                
                // Only use cached data if it exists - NO FALLBACK PRICES
                const cachedSilver = localStorage.getItem('silverSpot');
                const cachedGold = localStorage.getItem('goldSpot');
                const cachedTime = localStorage.getItem('lastUpdate');

                if (cachedSilver && cachedGold && cachedTime) {
                    // Only use cache if it's less than 24 hours old
                    const cacheAge = Date.now() - new Date(cachedTime).getTime();
                    if (cacheAge < 24 * 60 * 60 * 1000) {
                        silverSpot = parseFloat(cachedSilver);
                        goldSpot = parseFloat(cachedGold);
                        lastUpdate = new Date(cachedTime);
                        
                        updateSpotDisplays();
                        updateAllTables();
                        
                        if (isQuotaError) {
                            statusEl.textContent = '⚠ Quota exceeded - using cache';
                            statusEl.style.color = '#ffa500';
                        } else {
                            statusEl.textContent = '⚠ Cached (stale)';
                            statusEl.style.color = '#ffa500';
                        }
                    } else {
                        // Cache too old - don't use it
                        if (isQuotaError) {
                            statusEl.textContent = '✗ Quota exceeded - no cache';
                            statusEl.style.color = '#ff6b6b';
                        } else {
                            statusEl.textContent = '✗ No current data';
                            statusEl.style.color = '#ff6b6b';
                        }
                        // Clear stale prices
                        silverSpot = 0;
                        goldSpot = 0;
                        updateSpotDisplays();
                        updateAllTables();
                    }
                } else {
                    // No cache available - show error, no prices displayed
                    if (isQuotaError) {
                        statusEl.textContent = '✗ Quota exceeded';
                        statusEl.style.color = '#ff6b6b';
                    } else {
                        statusEl.textContent = '✗ No data available';
                        statusEl.style.color = '#ff6b6b';
                    }
                    silverSpot = 0;
                    goldSpot = 0;
                    updateSpotDisplays();
                    updateAllTables();
                    console.error('Unable to fetch prices and no valid cache available.');
                }
            }
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                
                // Update tab styles
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Update content visibility
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(targetTab + '-content').classList.add('active');
            });
        });

        // Refresh button - force refresh even if rate limited
        document.getElementById('refresh-btn').addEventListener('click', () => fetchPrices(true));

        // Initialize tables on load (will show "No price data available" if no data)
        updateAllTables();
        
        // Try to load from cache first
        const cachedSilver = localStorage.getItem('silverSpot');
        const cachedGold = localStorage.getItem('goldSpot');
        const cachedTime = localStorage.getItem('lastUpdate');
        
        if (cachedSilver && cachedGold && cachedTime) {
            const cacheAge = Date.now() - new Date(cachedTime).getTime();
            if (cacheAge < 24 * 60 * 60 * 1000) {
                silverSpot = parseFloat(cachedSilver);
                goldSpot = parseFloat(cachedGold);
                lastUpdate = new Date(cachedTime);
                updateSpotDisplays();
                updateAllTables();
                document.getElementById('refresh-status').textContent = '⚠ Cached';
                document.getElementById('refresh-status').style.color = '#ffa500';
            }
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    // Unregister any old service workers first
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('Unregistered old service worker');
                    }
                    
                    // Register new service worker
                    const registration = await navigator.serviceWorker.register('service-worker.js');
                    console.log('Service Worker registered:', registration);
                    
                    // Force update if there's a waiting service worker
                    if (registration.waiting) {
                        registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                        window.location.reload();
                    }
                } catch (error) {
                    console.log('Service Worker registration failed:', error);
                }
            });
        }

        // Initial load
        fetchPrices();
    </script>
</body>
